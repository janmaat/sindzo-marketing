# nginx-snippet voor Plesk — plak in:
#   Plesk → Websites & Domeinen → curanta.nl → Apache & nginx-instellingen
#   → "Aanvullende nginx-instructies" (Additional nginx directives)
#
# Plesk schopt deze regels in de bestaande server { } context, dus geen
# eigen server-block nodig. De volgorde hieronder is belangrijk.

# ----- Canonical: trailing slash weg (Astro: trailingSlash: 'never') -----
rewrite ^/(.*)/$ /$1 permanent;

# ----- Extensionless URLs: /trust → /trust/index.html -----
location / {
    try_files $uri $uri/index.html $uri.html =404;
}

# ----- Cache fingerprinted Astro-assets voor 1 jaar (immutable) -----
location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# ----- Fonts, ook fingerprinted of stabiel — 1 jaar -----
location ~* \.(woff2|woff|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# ----- HTML mag nooit lang cachen (anders zien bezoekers oude deploys) -----
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
}

# ----- Brotli + gzip — Plesk heeft beide modules in nginx -----
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml font/ttf;

brotli on;
brotli_comp_level 5;
brotli_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml font/ttf;

# ----- Security headers (HSTS + standaard set) -----
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header X-Frame-Options "DENY" always;
# Dezelfde CSP als in public/.htaccess (16-10-2026); daar staat de uitleg.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.curanta.nl; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://demo.curanta.nl https://app.curanta.nl; form-action 'self' https://demo.curanta.nl https://app.curanta.nl; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

# Scanpaden: 403, dezelfde lijst als in public/.htaccess.
location ~* (^|/)\.(env|git|svn|hg|aws|ssh|docker|vscode|idea|ds_store|htpasswd|bash_history)(/|$|\.) { return 403; }
location ~* (^|/)(wp-admin|wp-includes|wp-content|wp-login|wordpress|phpmyadmin|phpinfo|adminer|cgi-bin|xmlrpc\.php|wlwmanifest\.xml|server-status|vendor/phpunit|eval-stdin) { return 403; }
location ~* \.(php|phtml|asp|aspx|cgi|jsp|sh|bak|sql|cfg|ini|old|swp|env|7z|rar)$ { return 403; }

# ----- MIME-types die niet altijd in nginx default-mime.types staan -----
types {
    application/manifest+json webmanifest;
    font/woff2 woff2;
    text/vtt vtt;
}

# ----- 404-pagina -----
error_page 404 /404.html;
location = /404.html {
    internal;
}
