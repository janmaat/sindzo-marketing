# nginx-snippet voor de OUDE vhost — plak in:
#   Plesk → Websites & Domeinen → coheza.nl → Apache & nginx-instellingen
#   → "Aanvullende nginx-instructies" (Additional nginx directives)
#
# Doel: coheza.nl uitfaseren zonder bezoekers, bookmarks of bestaande links
# kwijt te raken. Alles gaat permanent naar het curanta.nl-equivalent, mét
# behoud van pad en querystring — dus /voor/vvt?utm_source=x komt uit op
# https://curanta.nl/voor/vvt?utm_source=x.
#
# Zet dit pas neer NADAT curanta.nl daadwerkelijk de site serveert. Doe je het
# eerder, dan verwijs je bezoekers naar een Plesk-standaardpagina.

return 301 https://curanta.nl$request_uri;

# ─────────────────────────────────────────────────────────────────────────────
# Drie dingen die je hierbij moet weten
#
# 1. HET CERTIFICAAT VAN coheza.nl MOET GELDIG BLIJVEN.
#    Een browser doet eerst de TLS-handshake en ziet de 301 pas daarna. Verloopt
#    het Let's Encrypt-certificaat van coheza.nl, dan krijgt de bezoeker een
#    certificaatwaarschuwing en bereikt de doorverwijzing hem nooit. Laat de
#    automatische verlenging dus doorlopen zolang deze redirect bestaat, en
#    verwijder de vhost niet "omdat hij toch alleen doorstuurt".
#
# 2. GOOI DE VHOST NIET METEEN WEG.
#    Een 301 is voor zoekmachines het signaal om de autoriteit van de oude URL
#    naar de nieuwe over te dragen, maar dat kost tijd en vergt dat de redirect
#    blijft staan. Reken op minimaal een jaar. Verwijder je de vhost eerder, dan
#    valt elke bestaande link dood in plaats van door te verwijzen.
#
# 3. DE CORS-LIJST HOEFT HIERVOOR NIETS.
#    coheza.nl staat niet in de policy "MarketingSites"
#    (src/Host/Curanta.Host/Program.cs), en dat is geen probleem: het demo-
#    formulier is een gewone <form method="post"> — een top-level navigatie, en
#    daar gaat CORS niet over. De browser stuurt hem en volgt de 302 naar
#    /bedankt. Zou het formulier ooit naar fetch/XHR overgaan, dan wordt die
#    lijst wél bepalend; nu niet. Niets te doen dus, maar noteer het zodat
#    niemand later "coheza.nl toevoegen" als fix voor een niet-bestaand
#    probleem opvoert.
